# Every day, and on every push: draws every image in README.md from live
# GitHub data (profile/generate.mjs) onto the output branch, where README.md
# loads them from.
name: Profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Draw the snake and the title
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node profile/generate.mjs dist
      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update profile images"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output

